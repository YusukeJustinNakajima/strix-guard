<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" role="img" aria-labelledby="title desc">
<title id="title">strix-guard architecture</title>
<desc id="desc">Strix, the host-side Docker proxy and decision pipeline, the in-sandbox HTTP sidecar, Caido, and the target</desc>
